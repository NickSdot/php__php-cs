name: Reproduce php-src PR

on:
  workflow_dispatch:
    inputs:
      php_src_repo:
        description: php-src repository containing the PR
        required: true
        default: php/php-src
        type: string
      pr:
        description: php-src PR number to reproduce
        required: true
        default: "22799"
        type: string
      push_generated_branch:
        description: Force-push the generated result to the PR head branch
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: reproduce-php-src-pr-${{ inputs.php_src_repo }}-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  reproduce:
    name: Reproduce php-src PR
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      PHP_SRC_REPO: ${{ inputs.php_src_repo }}
      PHP_SRC_PR: ${{ inputs.pr }}
      PHP_SRC_DIR: /tmp/php-src
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out php-src-cs
        uses: actions/checkout@v4

      - name: Set up PHP for php-src-cs
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer

      - name: Install php-src-cs dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install php-src build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            bison \
            build-essential \
            freetds-dev \
            gettext \
            libicu-dev \
            libbz2-dev \
            libcurl4-openssl-dev \
            libavif-dev \
            libdb-dev \
            libffi-dev \
            libfreetype-dev \
            libgd-dev \
            libgmp-dev \
            libjpeg-dev \
            libldap2-dev \
            libonig-dev \
            libpng-dev \
            libpq-dev \
            libreadline-dev \
            libsodium-dev \
            libsnmp-dev \
            libsqlite3-dev \
            libssl-dev \
            libtidy-dev \
            libwebp-dev \
            libxml2-dev \
            libxpm-dev \
            libzip-dev \
            pkg-config \
            re2c \
            unixodbc-dev \
            zlib1g-dev

      - name: Resolve php-src PR
        id: pr
        shell: bash
        run: |
          set -euo pipefail

          base_ref="$(gh pr view "$PHP_SRC_PR" --repo "$PHP_SRC_REPO" --json baseRefName --jq .baseRefName)"
          head_ref="$(gh pr view "$PHP_SRC_PR" --repo "$PHP_SRC_REPO" --json headRefName --jq .headRefName)"
          head_sha="$(gh pr view "$PHP_SRC_PR" --repo "$PHP_SRC_REPO" --json headRefOid --jq .headRefOid)"
          head_repo="$(gh pr view "$PHP_SRC_PR" --repo "$PHP_SRC_REPO" --json headRepository --jq .headRepository.nameWithOwner)"

          if [[ "$base_ref" != master ]]; then
            printf 'This workflow generates from upstream/master only; PR base is %s.\n' "$base_ref" >&2
            exit 1
          fi

          {
            printf 'base_ref=%s\n' "$base_ref"
            printf 'head_ref=%s\n' "$head_ref"
            printf 'head_sha=%s\n' "$head_sha"
            printf 'head_repo=%s\n' "$head_repo"
          } >> "$GITHUB_OUTPUT"

      - name: Check out fresh php-src base
        id: php_src
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PHP_SRC_DIR"
          git -C "$PHP_SRC_DIR" init
          git -C "$PHP_SRC_DIR" remote add upstream "https://github.com/$PHP_SRC_REPO.git"
          git -C "$PHP_SRC_DIR" remote add pr "https://github.com/${{ steps.pr.outputs.head_repo }}.git"

          git -C "$PHP_SRC_DIR" fetch --no-tags --depth=1 upstream \
            "${{ steps.pr.outputs.base_ref }}:refs/remotes/upstream/${{ steps.pr.outputs.base_ref }}"
          git -C "$PHP_SRC_DIR" fetch --no-tags --depth=1 pr \
            "${{ steps.pr.outputs.head_ref }}:refs/remotes/pr/${{ steps.pr.outputs.head_ref }}"

          fetched_head="$(git -C "$PHP_SRC_DIR" rev-parse "refs/remotes/pr/${{ steps.pr.outputs.head_ref }}")"
          if [[ "$fetched_head" != "${{ steps.pr.outputs.head_sha }}" ]]; then
            printf 'Expected PR head %s, fetched %s\n' "${{ steps.pr.outputs.head_sha }}" "$fetched_head" >&2
            exit 1
          fi

          commit_name="$(git -C "$PHP_SRC_DIR" show -s --format=%an "refs/remotes/pr/${{ steps.pr.outputs.head_ref }}")"
          commit_email="$(git -C "$PHP_SRC_DIR" show -s --format=%ae "refs/remotes/pr/${{ steps.pr.outputs.head_ref }}")"

          base_sha="$(git -C "$PHP_SRC_DIR" rev-parse "refs/remotes/upstream/${{ steps.pr.outputs.base_ref }}")"
          git -C "$PHP_SRC_DIR" checkout -B "${{ steps.pr.outputs.head_ref }}" "$base_sha"
          git -C "$PHP_SRC_DIR" config user.name "$commit_name"
          git -C "$PHP_SRC_DIR" config user.email "$commit_email"

          printf 'base_sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

      - name: Build managed PHP test runtime
        shell: bash
        run: |
          set -euo pipefail

          php <<'PHP'
          <?php

          $toolRoot = getcwd();

          require $toolRoot . '/vendor/autoload.php';

          use InternalsCS\Console\StreamConsoleIo;
          use InternalsCS\PhpSrc\PhpBuild;
          use InternalsCS\PhpSrc\PhpBuildPaths;
          use InternalsCS\PhpSrc\PhpSrcRoot;

          (new PhpBuild())->ensure(
              root: PhpSrcRoot::fromPath(getenv('PHP_SRC_DIR')),
              paths: PhpBuildPaths::default($toolRoot),
              force: true,
              io: new StreamConsoleIo(),
          );
          PHP

          {
            printf 'INTERNALS_CS_TEST_PHP_EXECUTABLE=%s/var/php-test-runtime/php\n' "$GITHUB_WORKSPACE"
            printf 'INTERNALS_CS_TEST_PHP_CGI_EXECUTABLE=%s/var/php-test-runtime/php-cgi\n' "$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      - name: Reproduce generated php-src commits
        shell: bash
        env:
          PHP_SRC_PUSH_TOKEN: ${{ secrets.PHP_SRC_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          contribute_args=(--php-src-dir "$PHP_SRC_DIR")

          if [[ "${{ inputs.push_generated_branch }}" == "true" ]]; then
            if [[ -z "${PHP_SRC_PUSH_TOKEN:-}" ]]; then
              printf 'PHP_SRC_PUSH_TOKEN is required when push_generated_branch is true.\n' >&2
              exit 1
            fi

            git -C "$PHP_SRC_DIR" remote add generated "https://github.com/${{ steps.pr.outputs.head_repo }}.git"
            git -C "$PHP_SRC_DIR" remote set-url --push generated "https://x-access-token:$PHP_SRC_PUSH_TOKEN@github.com/${{ steps.pr.outputs.head_repo }}.git"
            git -C "$PHP_SRC_DIR" fetch --no-tags --depth=1 generated \
              "${{ steps.pr.outputs.head_ref }}:refs/remotes/generated/${{ steps.pr.outputs.head_ref }}"

            fetched_push_head="$(git -C "$PHP_SRC_DIR" rev-parse "refs/remotes/generated/${{ steps.pr.outputs.head_ref }}")"
            if [[ "$fetched_push_head" != "${{ steps.pr.outputs.head_sha }}" ]]; then
              printf 'Expected push target %s, fetched %s\n' "${{ steps.pr.outputs.head_sha }}" "$fetched_push_head" >&2
              exit 1
            fi

            git -C "$PHP_SRC_DIR" config remote.pushDefault generated
            git -C "$PHP_SRC_DIR" branch --set-upstream-to="generated/${{ steps.pr.outputs.head_ref }}" "${{ steps.pr.outputs.head_ref }}"

            export GH_TOKEN="$PHP_SRC_PUSH_TOKEN"
            contribute_args+=(--lfg)
          fi

          printf 'y\n' | bin/contribute "${contribute_args[@]}"

      - name: Summarise generated php-src branch
        id: generated
        shell: bash
        run: |
          set -euo pipefail

          generated_head="$(git -C "$PHP_SRC_DIR" rev-parse HEAD)"
          old_pr_ref="refs/remotes/pr/${{ steps.pr.outputs.head_ref }}"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          summary_file="$RUNNER_TEMP/php-src-generation-summary.md"

          {
            printf '## php-src PR generation\n\n'
            printf '| Item | Value |\n'
            printf '|---|---|\n'
            printf '| Workflow run | %s |\n' "$run_url"
            printf '| Tool commit | `%s` |\n' "$GITHUB_SHA"
            printf '| php-src PR | `%s#%s` |\n' "$PHP_SRC_REPO" "$PHP_SRC_PR"
            printf '| Base branch | `%s` |\n' "${{ steps.pr.outputs.base_ref }}"
            printf '| Fresh base | `%s` |\n' "${{ steps.php_src.outputs.base_sha }}"
            printf '| Previous PR head | `%s` |\n' "${{ steps.pr.outputs.head_sha }}"
            printf '| Generated head | `%s` |\n\n' "$generated_head"
            printf '### Generated commits\n\n'
            git -C "$PHP_SRC_DIR" log --oneline --reverse "${{ steps.php_src.outputs.base_sha }}..HEAD"
          } > "$summary_file"

          cat "$summary_file"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

          git -C "$PHP_SRC_DIR" diff --stat "$old_pr_ref" HEAD | tee "$RUNNER_TEMP/generated-vs-current-pr.diffstat"
          git -C "$PHP_SRC_DIR" diff --name-status "$old_pr_ref" HEAD | tee "$RUNNER_TEMP/generated-vs-current-pr.name-status"
          git -C "$PHP_SRC_DIR" diff --binary "$old_pr_ref" HEAD > "$RUNNER_TEMP/generated-vs-current-pr.diff"

          {
            printf '\n### Diff from previous PR head\n\n```text\n'
            cat "$RUNNER_TEMP/generated-vs-current-pr.diffstat"
            printf '```\n'
          } > "$RUNNER_TEMP/php-src-generation-diff-summary.md"

          cat "$RUNNER_TEMP/php-src-generation-diff-summary.md"
          cat "$RUNNER_TEMP/php-src-generation-diff-summary.md" >> "$summary_file"
          cat "$RUNNER_TEMP/php-src-generation-diff-summary.md" >> "$GITHUB_STEP_SUMMARY"

          printf 'generated_head=%s\n' "$generated_head" >> "$GITHUB_OUTPUT"

      - name: Upload generated diff
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: php-src-generated-vs-current-pr-diff
          path: |
            ${{ runner.temp }}/php-src-generation-summary.md
            ${{ runner.temp }}/generated-vs-current-pr.diff
            ${{ runner.temp }}/generated-vs-current-pr.diffstat
            ${{ runner.temp }}/generated-vs-current-pr.name-status
          if-no-files-found: ignore
